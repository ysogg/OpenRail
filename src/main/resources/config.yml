# OpenRail configuration. Operators can change the copper settings in game with
# /copperrails and /coppermultiplier; those commands save back to this file.

copper-speed:
  enabled: true

  # Vanilla minecart max speed in blocks per tick (0.4 = 8 blocks/second). Multipliers apply to this value.
  base-max-speed: 0.4

  # How many blocks beneath the rail to look for copper.
  search-depth: 2

  # Top-speed multiplier
  # Must be above 0 and at most 3.75; above 2.5 carts start skipping curves.
  multipliers:
    unoxidized: 2.0
    exposed: 1.7
    weathered: 1.3
    oxidized: 1.1

arrival:
  # Clear a rider's destination when they reach that station.
  clear-destination: true

routing:
  # Routes whose travel times are within this many seconds (and within 5% of each other) count as equally
  # good; the one heading closer to the straight line towards the destination is chosen.
  tie-tolerance-seconds: 0.5

# Shows stations and junction signs on BlueMap, if BlueMap is installed. Ignored otherwise.
bluemap:
  enabled: true
  stations-label: "Rail Stations"
  junctions-label: "Rail Junctions"
  # Junction markers show what each junction connects to. Shown in the layer menu but off by default.
  show-junctions: true
  junctions-hidden-by-default: true
  # Hide junction markers when the camera is farther than this many blocks (0 = always show).
  junction-max-distance: 1500
  # The track between stations and junctions, labelled with Est. Time (all fresh copper - no copper).
  show-lines: true
  lines-label: "Rail Lines"
  line-color: "#c96f35"
  line-width: 4
